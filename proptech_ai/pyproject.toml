[project]
name = "proptech-ai"
version = "0.1.0"
description = "PropTech AI showcase for rental demand forecasting, recommendations, and NLP services"
authors = [
    { name = "Cascade", email = "example@example.com" }
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
